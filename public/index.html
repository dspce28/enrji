<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ENRJI — Future-grade tees</title>
  <meta name="description" content="Futuristic graphic t-shirts. Walk the 3D store, try designs on your own photo, check out in seconds.">
  <meta name="theme-color" content="#05060d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M19 2 L7 18 h7 l-3 12 L25 12 h-7 z' fill='%2300f0ff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <a class="skip" href="#app">Skip to content</a>
  <header class="topbar">
    <a href="#/" class="logo" aria-label="ENRJI home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M19 2 L7 18 h7 l-3 12 L25 12 h-7 z"/></svg>
      <span>ENRJI</span>
    </a>
    <button class="nav-toggle" aria-label="Menu" aria-expanded="false">☰</button>
    <nav class="nav" id="nav">
      <a href="#/shop">Shop</a>
      <a href="#/tour">Virtual Tour</a>
      <a href="#/try-on">Try It On</a>
      <a href="#/account" id="nav-account">Sign in</a>
      <a href="#/admin" id="nav-admin" hidden>Admin</a>
    </nav>
    <button class="cart-btn" id="cart-btn" aria-label="Open cart">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20.5" r="1.3"/><circle cx="17" cy="20.5" r="1.3"/></svg>
      <span class="badge" id="cart-count">0</span>
    </button>
  </header>

  <main id="app" tabindex="-1"></main>

  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Cart">
    <div class="drawer-panel">
      <div class="drawer-head"><h2>Cart</h2><button class="icon-btn" data-close-drawer aria-label="Close cart">✕</button></div>
      <div class="drawer-body" id="drawer-body"></div>
    </div>
  </aside>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <footer class="footer">
    <div>ENRJI · Future-grade tees · 240gsm organic cotton · Printed on demand</div>
    <div class="muted">Free shipping over $75 · 30-day returns</div>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
